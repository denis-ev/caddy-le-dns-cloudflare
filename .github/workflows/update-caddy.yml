name: Update Caddy Version

on:
  schedule:
    - cron: '0 7 * * *'   # check daily at 07:00 UTC
  workflow_dispatch:       # can also be triggered manually from the Actions tab

jobs:
  update-caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # allow committing and pushing to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get current version
        id: current
        run: echo "version=$(cat CADDY_VERSION)" >> $GITHUB_OUTPUT

      - name: Fetch latest Caddy release
        id: latest
        run: |
          latest=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | jq -r .tag_name | sed 's/^v//')
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Update CADDY_VERSION file
        if: ${{ steps.latest.outputs.latest != steps.current.outputs.version }}
        run: echo "${{ steps.latest.outputs.latest }}" > CADDY_VERSION

      - name: Commit and push changes
        if: ${{ steps.latest.outputs.latest != steps.current.outputs.version }}
        run: |
        Configured git committer as 'GitHub <noreply@github.com>'
  Configured git author as 'denis-ev <denis-ev@users.noreply.github.com>'
          git config user.name "denis-ev"
          git config user.email "denis-ev@users.noreply.github.com"
          git add CADDY_VERSION
          git commit -m "chore: bump Caddy to v${{ steps.latest.outputs.latest }}"
          git push origin HEAD:main
