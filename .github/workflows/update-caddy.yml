name: Check Upstream Caddy Release and Rebuild

on:
  schedule:
    - cron: '0 7 * * *'   # check daily at 07:00 UTC
  workflow_dispatch:       # allow manual trigger

jobs:
  check_caddy_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get current version
        id: current
        run: echo "version=$(cat CADDY_VERSION)" >> $GITHUB_OUTPUT

      - name: Fetch latest release
        id: latest
        run: |
          latest=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Update CADDY_VERSION
        if: ${{ steps.latest.outputs.latest != steps.current.outputs.version }}
        run: |
          echo "${{ steps.latest.outputs.latest }}" > CADDY_VERSION

      - name: Create Pull Request
        if: ${{ steps.latest.outputs.latest != steps.current.outputs.version }}
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: bump caddy to v${{ steps.latest.outputs.latest }}"
          branch: bump-caddy-${{ steps.latest.outputs.latest }}
          title: "Update Caddy to v${{ steps.latest.outputs.latest }}"
          body: |
            Auto-generated PR: bump base image to upstream Caddy v${{ steps.latest.outputs.latest }}
          labels: dependencies
          signoff: false
